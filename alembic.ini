[alembic]
# Alembic scripts live beside the application and are run from backend/.
script_location = %(here)s/alembic
prepend_sys_path = .
# This value is replaced from Settings/DATABASE_URL by alembic/env.py.
sqlalchemy.url =

# Keep migration output useful while avoiding noisy SQL logs by default.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
